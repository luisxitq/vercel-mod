<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANDA VIP - Admin Panel Mobile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0c; --card: #13131a; --accent: #ff2e43; --text: #f1f1f5; --muted: #8b8b9e; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }

        /* Header Móvil */
        .header {
            background: var(--card);
            padding: 15px 20px;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h2 {
            color: var(--accent);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Contenedor Principal */
        .main { 
            flex: 1; 
            padding: 15px; 
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        h3 {
            font-size: 1.1rem;
            margin: 15px 0 10px 0;
            color: var(--text);
        }

        .card { 
            background: var(--card); 
            border: 1px solid #222; 
            border-radius: 12px; 
            padding: 15px; 
            margin-bottom: 20px; 
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 5px;
            display: block;
        }

        .input-group { 
            display: flex; 
            gap: 8px; 
        }

        input, select { 
            width: 100%; 
            padding: 12px; 
            background: #000; 
            border: 1px solid #333; 
            color: #fff; 
            border-radius: 8px; 
            font-size: 0.95rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        .btn { 
            padding: 12px 16px; 
            border: none; 
            border-radius: 8px; 
            font-weight: 600; 
            cursor: pointer; 
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-primary { background: var(--accent); color: #fff; }
        .btn-secondary { background: #222; color: #fff; }
        .btn-danger { background: #dc3545; color: #fff; }

        /* Grid adaptativo */
        .grid { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 12px; 
        }

        .key-box { 
            background: #181824; 
            border: 1px solid #2a2a38; 
            border-radius: 10px; 
            padding: 14px; 
        }

        .badge { 
            padding: 3px 8px; 
            border-radius: 4px; 
            font-size: 0.7rem; 
            font-weight: 600;
            text-transform: uppercase; 
        }

        .active { background: #28a74522; color: #28a745; }
        .inactive { background: #dc354522; color: #dc3545; }

        /* Ajustes para pantallas de escritorio o tablets */
        @media (min-width: 600px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .main {
                padding: 25px;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <h2><i class="fas fa-shield-alt"></i> PANDA VIP</h2>
        <span style="font-size: 0.8rem; color: var(--muted);">Panel Móvil</span>
    </header>

    <main class="main">
        <h3>Crear Nueva Licencia</h3>
        <div class="card">
            <div class="form-group">
                <label>Llave a Generar</label>
                <div class="input-group">
                    <input type="text" id="keyInput" placeholder="PANDA-XXXXX-XXXXX-XXXXX" readonly>
                    <button class="btn btn-secondary" onclick="generateKey()"><i class="fas fa-dice"></i></button>
                </div>
            </div>
            <div class="form-group">
                <label>Duración (Días)</label>
                <input type="number" id="daysInput" value="30">
            </div>
            <div class="form-group">
                <label>Límite de Dispositivos</label>
                <select id="accessInput">
                    <option value="1">1 Dispositivo (Lock HWID)</option>
                    <option value="∞">Ilimitado (∞)</option>
                </select>
            </div>
            <button class="btn btn-primary" style="width: 100%; margin-top: 5px;" onclick="saveKey()">
                <i class="fas fa-save"></i> Guardar Key
            </button>
        </div>

        <h3>Licencias Registradas</h3>
        <div id="keysContainer" class="grid"></div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://aimengine-62132-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function generateKey() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            const seg = () => Array.from({length: 5}, () => chars.charAt(Math.floor(Math.random() * chars.length))).join('');
            document.getElementById('keyInput').value = `PANDA-${seg()}-${seg()}-${seg()}`;
        }

        function saveKey() {
            const key = document.getElementById('keyInput').value.trim();
            const days = parseInt(document.getElementById('daysInput').value);
            const access = document.getElementById('accessInput').value;

            if(!key) return alert('Genera una llave primero');

            const now = new Date();
            const exp = new Date(now.getTime() + (days * 86400000));
            const pad = n => n < 10 ? '0' + n : n;
            const fmt = d => `${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;

            db.ref(`userinfo/${key}`).set({
                status: "active",
                validity: fmt(exp),
                access: access,
                device: "null",
                rgtime: fmt(now)
            }).then(() => {
                alert('¡Key guardada con éxito!');
                generateKey();
            }).catch(err => alert('Error Firebase: ' + err.message));
        }

        db.ref('userinfo').on('value', snap => {
            const container = document.getElementById('keysContainer');
            container.innerHTML = '';
            const data = snap.val() || {};

            Object.keys(data).forEach(k => {
                const item = data[k];
                container.innerHTML += `
                    <div class="key-box">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <b style="color:var(--accent); font-size:0.85rem; word-break: break-all;">${k}</b>
                            <span class="badge ${item.status}">${item.status}</span>
                        </div>
                        <div style="font-size:0.75rem; color:var(--muted); margin: 10px 0; line-height: 1.5;">
                            <div><b>Expira:</b> ${item.validity}</div>
                            <div><b>HWID:</b> ${item.device}</div>
                        </div>
                        <button class="btn btn-danger" style="width:100%; padding: 6px; font-size:0.75rem;" onclick="db.ref('userinfo/${k}').remove()">
                            <i class="fas fa-trash"></i> Eliminar
                        </button>
                    </div>
                `;
            });
        });

        generateKey();
    </script>
</body>
</html>

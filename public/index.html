<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANDA VIP - Admin Panel (Vercel Host)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0c; --card: #13131a; --accent: #ff2e43; --text: #f1f1f5; --muted: #8b8b9e; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background: var(--card); padding: 20px; border-right: 1px solid #222; }
        .main { flex: 1; padding: 30px; }
        .card { background: var(--card); border: 1px solid #222; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .input-group { display: flex; gap: 10px; margin-top: 5px; }
        input, select { width: 100%; padding: 10px; background: #000; border: 1px solid #333; color: #fff; border-radius: 6px; }
        .btn { padding: 10px 15px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-secondary { background: #222; color: #fff; }
        .btn-danger { background: #dc3545; color: #fff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .key-box { background: #181824; border: 1px solid #2a2a38; border-radius: 8px; padding: 15px; }
        .badge { padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; text-transform: uppercase; }
        .active { background: #28a74522; color: #28a745; }
        .inactive { background: #dc354522; color: #dc3545; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2 style="color: var(--accent); margin-bottom: 20px;"><i class="fas fa-shield-alt"></i> PANDA VERCEL</h2>
        <p style="color: var(--muted); font-size: 0.85rem;">Generador de Llaves</p>
    </aside>

    <main class="main">
        <h2>Crear Licencia</h2>
        <div class="card" style="max-width: 500px;">
            <div style="margin-bottom: 12px;">
                <label>Llave Generada</label>
                <div class="input-group">
                    <input type="text" id="keyInput" placeholder="PANDA-XXXXX-XXXXX-XXXXX">
                    <button class="btn btn-secondary" onclick="generateKey()"><i class="fas fa-dice"></i> Random Key</button>
                </div>
            </div>
            <div style="margin-bottom: 12px;">
                <label>Duración (Días)</label>
                <input type="number" id="daysInput" value="30">
            </div>
            <div style="margin-bottom: 15px;">
                <label>Límite de Dispositivos (Access)</label>
                <select id="accessInput">
                    <option value="1">1 Dispositivo</option>
                    <option value="∞">Ilimitado (∞)</option>
                </select>
            </div>
            <button class="btn btn-primary" style="width: 100%;" onclick="saveKey()">Guardar Key</button>
        </div>

        <h2>Lista de Llaves</h2>
        <div id="keysContainer" class="grid"></div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script>
        // CONFIGURACIÓN DE TU FIREBASE REALTIME DATABASE
        const firebaseConfig = {
            databaseURL: "https://TU_PROYECTO-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function generateKey() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            const seg = () => Array.from({length: 5}, () => chars.charAt(Math.floor(Math.random() * chars.length))).join('');
            document.getElementById('keyInput').value = `PANDA-${seg()}-${seg()}-${seg()}`;
        }

        function saveKey() {
            const key = document.getElementById('keyInput').value.trim();
            const days = parseInt(document.getElementById('daysInput').value);
            const access = document.getElementById('accessInput').value;

            if(!key) return alert('Genera una llave primero');

            const now = new Date();
            const exp = new Date(now.getTime() + (days * 86400000));
            const pad = n => n < 10 ? '0' + n : n;
            
            const fmt = d => `${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;

            db.ref(`userinfo/${key}`).set({
                status: "active",
                validity: fmt(exp),
                access: access,
                device: "null",
                rgtime: fmt(now)
            }).then(() => {
                alert('Key guardada en el servidor');
                generateKey();
            });
        }

        db.ref('userinfo').on('value', snap => {
            const container = document.getElementById('keysContainer');
            container.innerHTML = '';
            const data = snap.val() || {};

            Object.keys(data).forEach(k => {
                const item = data[k];
                container.innerHTML += `
                    <div class="key-box">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <b style="color:var(--accent); font-size:0.9rem;">${k}</b>
                            <span class="badge ${item.status}">${item.status}</span>
                        </div>
                        <div style="font-size:0.75rem; color:var(--muted); margin: 10px 0;">
                            <div>Expira: ${item.validity}</div>
                            <div>Device ID: ${item.device}</div>
                        </div>
                        <button class="btn btn-danger" style="padding: 4px 8px; font-size:0.7rem;" onclick="db.ref('userinfo/${k}').remove()">Eliminar</button>
                    </div>
                `;
            });
        });

        generateKey();
    </script>
</body>
</html>
